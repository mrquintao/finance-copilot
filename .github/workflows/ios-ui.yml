name: iOS UI Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    name: Capture iOS UI
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start mock backend
        run: |
          set -euo pipefail

          cat > mock_server.py <<'PY'
          import socketserver
          from http.server import BaseHTTPRequestHandler
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path.cwd()

          routes = {
              "/analytics/spending-summary":
                  root / "ios/FinanceCopilotTests/Fixtures/summary.json",
              "/analytics/spending-by-category":
                  root / "ios/FinanceCopilotTests/Fixtures/categories.json",
          }

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = urlparse(self.path).path

                  if path == "/health":
                      self.respond(200, b'{"status":"ok"}')
                      return

                  fixture = routes.get(path)
                  if fixture and fixture.exists():
                      self.respond(200, fixture.read_bytes())
                      return

                  self.respond(404, b'{"detail":"Not Found"}')

              def respond(self, status, body):
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          class Server(socketserver.ThreadingMixIn, socketserver.TCPServer):
              allow_reuse_address = True
              daemon_threads = True

          print("Starting mock backend on 127.0.0.1:8000", flush=True)

          with Server(("127.0.0.1", 8000), Handler) as server:
              print("Mock backend ready", flush=True)
              server.serve_forever()
          PY

          nohup python3 -u mock_server.py \
            > mock-backend.log 2>&1 &

          MOCK_PID=$!
          echo "$MOCK_PID" > mock-backend.pid
          echo "Mock backend PID: $MOCK_PID"

          for i in {1..10}; do
            if curl \
              --noproxy '*' \
              --silent \
              --show-error \
              --fail \
              --max-time 2 \
              http://127.0.0.1:8000/health; then

              echo
              echo "Mock backend is ready."
              cat mock-backend.log
              exit 0
            fi

            if ! kill -0 "$MOCK_PID" 2>/dev/null; then
              echo "Mock backend exited unexpectedly:"
              cat mock-backend.log
              exit 1
            fi

            echo "Waiting for mock backend..."
            sleep 1
          done

          echo "Mock backend did not become ready."
          cat mock-backend.log
          lsof -nP -iTCP:8000 || true
          exit 1

      - name: Configure UI backend
        run: |
          cat > ios/Config/Local.xcconfig <<'EOF'
          API_BASE_URL = http:$(SLASH)$(SLASH)127.0.0.1:8000
          EOF

          echo "Local.xcconfig:"
          cat ios/Config/Local.xcconfig

      - name: Test mock API
        run: |
          echo "Health:"
          curl --noproxy '*' --fail --silent --show-error \
            http://127.0.0.1:8000/health

          echo
          echo "Summary:"
          curl --noproxy '*' --fail --silent --show-error \
            http://127.0.0.1:8000/analytics/spending-summary

          echo
          echo "Categories:"
          curl --noproxy '*' --fail --silent --show-error \
            http://127.0.0.1:8000/analytics/spending-by-category

          echo

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select iPhone Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available |
            grep -m 1 "iPhone" |
            sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')

          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi

          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_ID"

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build Finance Copilot
        run: |
          xcodebuild \
            -project ios/FinanceCopilot.xcodeproj \
            -scheme FinanceCopilot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Find app
        run: |
          APP_PATH="$PWD/build/Build/Products/Debug-iphonesimulator/FinanceCopilot.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "FinanceCopilot.app not found."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist")

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          echo "App: $APP_PATH"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Install app
        run: |
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"

      - name: Launch app
        run: |
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"

          # Aguarda a UI carregar e buscar os dados do mock backend
          sleep 8

      - name: Capture screenshot
        run: |
          mkdir -p screenshots

          xcrun simctl io \
            "$SIMULATOR_ID" \
            screenshot screenshots/finance-copilot.png

          ls -lh screenshots/

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: finance-copilot-ui
          path: screenshots/finance-copilot.png
          retention-days: 7

      - name: Upload mock backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-backend-log
          path: mock-backend.log
          retention-days: 7
