name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Finance Copilot
    runs-on: macos-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Show available schemes
        run: |
          xcodebuild \
            -project ios/FinanceCopilot.xcodeproj \
            -list

      - name: Build Finance Copilot
        run: |
          xcodebuild \
            -project ios/FinanceCopilot.xcodeproj \
            -scheme FinanceCopilot \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
