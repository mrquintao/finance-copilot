name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finance_copilot
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: finance_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://finance_copilot:ci_only_password@localhost:5432/finance_copilot
      TEST_DATABASE_URL: postgresql+psycopg://finance_copilot:ci_only_password@localhost:5432/finance_copilot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e "backend[test]"

      - name: Ruff lint
        run: python -m ruff check backend scripts

      - name: Ruff format
        run: python -m ruff format --check backend scripts

      - name: Apply migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Check models match migrations
        run: python -m alembic -c backend/alembic.ini check

      - name: Run tests
        run: python -m pytest backend/tests -q
